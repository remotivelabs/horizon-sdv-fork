# Description:
# Default values for the remotive-topology builder image workflow Helm chart.
# Namespace: if `namespace` is non-empty, use it; else `namespacePrefix` + "workflows".
namespacePrefix: ""
namespace: ""
# Set by GitOps (userpass | app | none). Remote: ClusterWorkflowTemplate prepare-pipeline-git-creds runs before git fetch.
git:
  authMethod: ""
workflowTemplateName: remotive-builder-image
# Synchronization mutex name for Argo Workflows; "" disables concurrency blocking.
builderImageConcurrencyMutexName: remotive-builder-image
# Name of the shared ClusterWorkflowTemplate (from workloads/common/common_docker_image, module workloads-common).
clusterWorkflowTemplateName: common-docker-image-build
podGcStrategy: OnWorkflowCompletion
workflowTtlSecondsAfterCompletion:
# When set, cloud parameters resolve from this ConfigMap (keys CLOUD_PROJECT, CLOUD_REGION,
# CLOUD_ZONE); "" for local clusters (falls back to spec.cloud*).
cloudEnvConfigMapName: "horizon-workflow-cloud-env"

spec:
  # Target project/region/zone. Chart defaults for local helm; GitOps remotive-topology
  # module overrides from config.projectID, .region, .zone.
  cloudProject: sdva-2108202401
  cloudRegion: europe-west1
  cloudZone: europe-west1-d
  # Docker image path under the artifact registry.
  dockerArtifactPathName: horizon-sdv/remotive-builder
  # When true, do not push built images.
  dryRun: "false"
  # Image tag to build/push.
  imageTag: "argowf-latest"
  dockerfileDir: workloads/remotive/pipelines/environment/docker_image_template
  # Base image used in the Dockerfile build.
  linuxDistribution: ubuntu:24.04
  gcloudCliVersion: "latest"
  kubectlVersion: "latest"
  packerVersion: "1.15.0"
  # Non-local: align with gitops config.workloads.android.url / .branch (same monorepo).
  pipelineRepoUrl: ""
  pipelineRepoRevision: ""
  # Optional Secret for private HTTPS when scm.authMethod is pat. app uses per-run {{workflow.uid}}-pipeline-git-creds.
  pipelineRepoSecret: ""
  # When true, pods use workflow-executor-elevated; otherwise serviceAccountName below.
  useElevatedWorkflowIam: true
  serviceAccountName: workflow-executor
