#
# PostDelete hook: best-effort removal of remotive-owned ComputeInstanceTemplate CRs once the
# remotive-topology child Application's resources have been pruned (manual `argocd app delete`,
# out-of-band uninstall). Module Manager's remotive-topology disable is the authoritative cleanup: it
# deletes every ComputeInstanceTemplate in the KCC namespace as soon as the child Application delete is
# issued and waits for CNRM to finalize (GCP templates follow), so this hook normally finds nothing.
#
# NOTE: Argo CD has no "PreDelete" hook type — a Job annotated PreDelete is silently never created —
# hence PostDelete. Regular resources are already pruned when a PostDelete hook runs, so the
# ServiceAccount / Role / RoleBinding are hook resources too, created together with the Job in the
# module-owned KCC namespace, which outlives the child Application (rendered by the
# mod-remotive-topology parent chart). Argo CD adds post-delete-finalizer.argocd.argoproj.io to the
# child Application; Module Manager strips *.argoproj.io finalizers if the Application gets stuck.
#
# Scope: label horizon-sdv.io/remotive-kcc-template=true, name prefix remotive-it-* fallback, then a
# delete-all safety net — the KCC namespace is dedicated to this module and never shared with
# workloads-android (its cf-it-* CRs live in the workflows namespace).
{{- if and .Values.kcc .Values.kcc.instanceTemplates .Values.kcc.instanceTemplates.enabled }}
{{- $ns := include "remotive-instance-template.kccNamespace" . }}
{{- $img := .Values.spec.cnrmPresDeleteImage | default "gcr.io/google.com/cloudsdktool/cloud-sdk:461.0.0" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remotive-instance-template-cnrm-postdelete
  namespace: {{ $ns | quote }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remotive-instance-template-cnrm-postdelete
  namespace: {{ $ns | quote }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
rules:
  - apiGroups: ["compute.cnrm.cloud.google.com"]
    resources: ["computeinstancetemplates"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remotive-instance-template-cnrm-postdelete
  namespace: {{ $ns | quote }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remotive-instance-template-cnrm-postdelete
subjects:
  - kind: ServiceAccount
    name: remotive-instance-template-cnrm-postdelete
    namespace: {{ $ns | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: remotive-instance-template-cnrm-postdelete
  namespace: {{ $ns | quote }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    # KCC can take a long time to finalize GCP deletion.
    argocd.argoproj.io/hook-timeout: "1200"
spec:
  ttlSecondsAfterFinished: 600
  # Pod creation is retried by the Job controller while the hook ServiceAccount is still being created.
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remotive-instance-template-cnrm-postdelete
    spec:
      serviceAccountName: remotive-instance-template-cnrm-postdelete
      restartPolicy: Never
      {{- if .Values.spec.nodeSelector }}
      nodeSelector:
{{- toYaml .Values.spec.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.spec.tolerations }}
      tolerations:
{{- toYaml .Values.spec.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: kubectl
          image: {{ $img | quote }}
          imagePullPolicy: IfNotPresent
          command: [bash, -euo, pipefail, -c]
          args:
            - |
              set -euo pipefail
              ns="{{ $ns }}"
              echo "PostDelete: removing remotive ComputeInstanceTemplate CRs (labeled) in ${ns}"
              kubectl delete computeinstancetemplates.compute.cnrm.cloud.google.com \
                -n "${ns}" \
                -l horizon-sdv.io/remotive-kcc-template=true \
                --ignore-not-found=true \
                --wait=true \
                --timeout=900s
              echo "PostDelete: fallback — any remaining remotive-it-* ComputeInstanceTemplate (missed label)"
              while IFS= read -r res; do
                [ -z "${res}" ] && continue
                base="${res##*/}"
                case "${base}" in remotive-it-*)
                  kubectl delete "${res}" -n "${ns}" \
                    --ignore-not-found=true \
                    --wait=true \
                    --timeout=900s
                  ;;
                esac
              done < <(kubectl get computeinstancetemplates.compute.cnrm.cloud.google.com -n "${ns}" -o name 2>/dev/null || true)
              echo "PostDelete: safety net — remove any remaining ComputeInstanceTemplate in ${ns} (namespace is dedicated to remotive-topology)"
              kubectl delete computeinstancetemplates.compute.cnrm.cloud.google.com \
                -n "${ns}" \
                --all \
                --ignore-not-found=true \
                --wait=true \
                --timeout=900s
              echo "PostDelete: remotive CNRM templates cleared"
{{- end }}
