# Argo Events Sensor: Developer Portal / webhook-dispatch → remotive-instance-template workflow.
# Webhook fields -> Workflow parameters by name (values.webhookWorkflowParameters);
# requires Argo Events with GJSON array queries (1.6+).
{{- $root := . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-{{ $root.Values.workflowTemplateName }}
  namespace: {{ $root.Values.namespacePrefix }}argo-events
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - {{ $root.Values.workflowTemplateName | quote }}
  triggers:
    - template:
        name: submit-{{ $root.Values.workflowTemplateName }}
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: webhook-{{ $root.Values.workflowTemplateName }}-
                namespace: {{ include "remotive-instance-template.workflowNamespace" $root | quote }}
              spec:
                serviceAccountName: {{ include "remotive-instance-template.workflowServiceAccountName" $root | quote }}
                workflowTemplateRef:
                  name: {{ $root.Values.workflowTemplateName | quote }}
                arguments:
                  parameters:
{{- include "remotive-instance-template.sensorWebhookParameters" $root }}
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
{{- include "remotive-instance-template.sensorWebhookParameterMappings" $root }}
